name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rails and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      RAILS_ENV: test
      DATABASE_URL: postgresql:///make_at_tadl_test
      SECRET_KEY_BASE_DUMMY: "1"
      MAILGUN_API_KEY: ""
      MAILGUN_DOMAIN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install native dependencies
        # ruby-vips uses FFI; its runtime library needs no image-library headers.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev libvips42t64

      - name: Set up Ruby and locked gems
        uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1
        with:
          bundler-cache: true

      - name: Set up Node for browser tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/browser/package-lock.json

      - name: Start local PostgreSQL
        # A local socket preserves the demo/fixture guards against remote databases.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --createdb --no-superuser "$USER"

      - name: Prepare an empty test database
        # db:prepare/db:setup can load seeds, which these synthetic fixtures reject.
        run: bundle exec rails db:create db:schema:load db:migrate

      - name: Check eager loading
        run: bundle exec rails zeitwerk:check

      - name: Run Rails tests
        run: bundle exec rails test

      - name: Compile assets
        run: bundle exec rails assets:precompile

      - name: Install locked browser-test dependencies
        working-directory: test/browser
        run: npm ci --ignore-scripts

      - name: Check runner Chrome
        # ubuntu-24.04 supplies Chrome and its native dependencies.
        run: google-chrome --version

      - name: Run browser regressions sequentially
        working-directory: test/browser
        env:
          ADMIN_SCREENSHOTS: ${{ github.workspace }}/tmp/browser-screenshots
        run: npm test

      - name: Save synthetic browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-screenshots
          path: tmp/browser-screenshots
          if-no-files-found: ignore
          retention-days: 7
